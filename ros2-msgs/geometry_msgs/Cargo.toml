[package]
name = "geometry_msgs"
version = "0.1.0"
edition = "2024"

[dependencies]
cdr-runtime = { path = "../cdr-runtime" }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-big-array = { version = "0.5", optional = true}
std_msgs = { path = "../std_msgs" }

[features]
default = []
serde = ["dep:serde", "std_msgs/serde", "dep:serde-big-array"]
