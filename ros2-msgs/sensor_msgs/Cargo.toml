[package]
name = "sensor_msgs"
version = "0.1.0"
edition = "2024"

[dependencies]
cdr-runtime = { path = "../cdr-runtime" }
serde = { version = "1.0", features = ["derive"], optional = true }
builtin_interfaces = { path = "../builtin_interfaces" }
geometry_msgs = { path = "../geometry_msgs" }
std_msgs = { path = "../std_msgs" }

[features]
default = []
serde = ["dep:serde", "builtin_interfaces/serde", "geometry_msgs/serde", "std_msgs/serde"]
