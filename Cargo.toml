[workspace]
members = [
    "ros2-msgs/*",
    "crates/*",
    "app/replay",
    "app/surfel-map-test",
    "app/surfel-viewer"
]
resolver = "3"
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["agentoflyra"]
description = "fastlio example for rust"

[workspace.dependencies]
anyhow = "1.0.103"
camino = "1.2.3"
nalgebra = { version = "0.35.0", features = ["sparse"] }
approx = "0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
ringbuffer-spsc = "0.2.2"
hashbrown = "0.16.1"
smallvec = "1.15.2"
slotmap = "1.1.1"
csv = "1.4.0"
